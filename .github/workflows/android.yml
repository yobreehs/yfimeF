name: Android CI

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'

# The release step below creates/updates the "autobuild" release with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug
      run: ./gradlew assembleUniversalDebug

    - name: Build Release
      run: ./gradlew assembleUniversalRelease

    - name: Upload a Debug Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rvxp-ci-debug-apk
        path: app/build/outputs/apk/universal/debug

    - name: Upload a Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rvxp-ci-release-apk
        path: |
          app/build/outputs/apk/universal/release
          app/build/outputs/mapping/universalRelease/mapping.txt

    - name: Create AutoBuild Release
      run: |
        GIT_DESCRIBE=$(git rev-parse --short HEAD)
        GIT_COMMIT_DATE=$(git log -1 --format=%cd --date=format:%y%m%d)
        # The DRAFT_RELEASE repository variable keeps push builds unpublished until the scheduled
        # publish step flips the draft; when it is unset, releases are published immediately.
        DRAFT_FLAG=""
        if [ "${{ vars.DRAFT_RELEASE }}" = "1" ]; then DRAFT_FLAG="--draft"; fi
        cd app/build/outputs/apk/universal/release/
        mv app-universal-release.apk ReVancedXposedSpotify-${GIT_COMMIT_DATE}.apk
        gh release delete autobuild --yes || true
        gh release create autobuild ReVancedXposedSpotify-${GIT_COMMIT_DATE}.apk ${DRAFT_FLAG} --latest --title "Build ${GIT_COMMIT_DATE}" --notes "Commit ${GIT_DESCRIBE}. Package name: sul.j. Update the app manually if the CI signing key changed."
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}